[package]
name = "hashguard"
version = "0.1.0"
edition = "2021"
description = "Windows integrity checker: SHA-256 hashing, Authenticode signature verification, baselines and heuristics for spotting tampered or suspicious binaries"
license = "MIT"
readme = "README.md"
keywords = ["security", "authenticode", "integrity", "windows", "hash"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
